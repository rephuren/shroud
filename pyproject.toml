[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shroud"
version = "0.2.0"
description = "Детектор стеганографии в изображениях: структура файла, LSB, RS-анализ, хи-квадрат"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "misxnthropy" }]
dependencies = ["pillow>=12.3.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
shroud = "shroud.__main__:main"

[tool.setuptools]
packages = ["shroud"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
